name: Publish marketing site

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  # Releases created by the app's GITHUB_TOKEN do not trigger other workflows.
  workflow_run:
    workflows: ["Publish macOS release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install test dependencies
        working-directory: website
        run: npm ci
      - name: Build with the latest public release
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs --refresh-release
      - name: Install test browser
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile, accessibility and downloads
        working-directory: website
        run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
